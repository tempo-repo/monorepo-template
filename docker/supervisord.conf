[supervisord]
nodaemon=true
user=root

[program:frontend]
command=node /runner/frontend/repo/apps/frontend/server.js
directory=/runner/frontend/repo/apps/frontend
environment=PORT="3000",HOSTNAME="0.0.0.0"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
