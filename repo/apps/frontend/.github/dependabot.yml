version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 12 1,15 * *"
    ignore:
      - dependency-name: "*eslint*"
      - dependency-name: "*storybook*"
    groups:
      # This dependencies can break app if they will be updated to
      # major version
      core-deps:
        patterns: ["next", "next-themes", "react", "react-dom", "tailwindcss", "typescript"]
        update-types: ["minor", "patch"]
      production-deps:
        dependency-type: "production"
      development-deps:
        dependency-type: "development"
        update-types: ["major", "minor"]
    open-pull-requests-limit: 15
    pull-request-branch-name:
      separator: "-"
    commit-message:
      # cause a release for non-dev-deps
      prefix: fix(deps)
      # no release for dev-deps
      prefix-development: chore(dev-deps)